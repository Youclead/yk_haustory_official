<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>역곡지구 하우스토리 입주예정자 모임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: linear-gradient(135deg, #1d2b51, #0a1128);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            z-index: 1;
        }
        .mobile-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255, 255, 255, 0.03) 10px, rgba(255, 255, 255, 0.03) 11px),
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.05) 0%, transparent 60%);
            z-index: -1;
        }
        .mobile-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 25px 25px;
            z-index: -1;
        }
        .header {
            text-align: center;
            padding: 40px 0 30px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .content-box h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #fff;
        }
        .content-box ul {
            list-style: none;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
        .content-box li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 22px;
        }
        .content-box li:last-child {
            margin-bottom: 0;
        }
        .content-box li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #fff;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn-naver {
            background-color: #03c75a;
            color: #ffffff;
        }
        .btn-kakao-main {
            background-color: #FEE500;
            color: #000000;
        }
        .btn-kakao-sub {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #FEE500;
            backdrop-filter: blur(5px);
        }
        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            border: none;
        }
        
        /* 네이버 카페 하단 문구 & 링크 영역 스타일 */
        .btn-sub-texts {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-top: -6px;
            margin-bottom: 4px;
            padding-right: 4px;
        }
        .btn-notice {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            word-break: keep-all;
            text-align: right;
        }
        .guide-link {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
        }
        .guide-link:active {
            color: rgba(255, 255, 255, 0.5);
        }
        .highlight {
            color: #ff4444;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- 헤더 영역 -->
    <div class="header">
        <span class="badge">입주예정자 공식 소통 창구</span>
        <h1 class="title">역곡지구 하우스토리</h1>
        <p class="subtitle">
            성공적인 입주를 위해 함께해 주세요.
        </p>
    </div>

    <!-- 안내 본문 -->
    <div class="content-box">
        <h3>📢 입예협 주요 추진 목표</h3>
        <ul>
            <li>성공적인 마감을 위한 시공 품질 모니터링</li>
            <li>55타입 판상형/타워형 등 구조별 하자 사전 점검</li>
            <li>소통 창구 일원화 및 입주민 권익 보호</li>
        </ul>
    </div>

    <!-- 터치 최적화 대형 버튼 영역 -->
    <div class="btn-group">
        <!-- 네이버 카페 -->
        <a href="https://cafe.naver.com/yeokgoka2" class="btn btn-naver">
            네이버 공식 카페 가입하기
        </a>
        
        <!-- 네이버 카페 하단 안내 문구 및 캡쳐 방법 안내 링크 -->
        <div class="btn-sub-texts">
            <div class="btn-notice">※ 외부인 참여를 제한하기 위해 카페 가입시 <span class="highlight">인증</span>이 필요합니다.</div>
            <a href="guide.html" class="guide-link">* 카페가입을위한 인증화면 캡쳐방법 안내</a>
        </div>
        
        <!-- 인스타그램 -->
        <a href="https://www.instagram.com/yk_haustory_official?igsh=aXFva3JwaW5wdjNx" class="btn btn-insta">
            인스타그램 공식 계정 방문하기
        </a>

        <!-- 카카오톡 공식방 -->
        <a href="https://open.kakao.com/o/gg9uYpDi" class="btn btn-kakao-main">
            [공식] 카카오톡 단체방 참여하기
        </a>

        <!-- 카카오톡 수다방 -->
        <a href="https://open.kakao.com/o/gYtfDYFi" class="btn btn-kakao-sub">
            [수다방] 카카오톡 단체방 참여하기
        </a>
    </div>
</div>

</body>
</html>
