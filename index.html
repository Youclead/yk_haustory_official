<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>역곡지구 하우스토리 입주예정자 모임</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* PC 환경 배경: PC로 볼 때는 양옆을 까맣게 채워서 모바일 화면만 돋보이게 합니다 */
        body {
            background-color: #050505; 
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* PC에서 '아이폰 화면' 역할을 할 메인 뼈대 (모바일에서는 화면에 꽉 참) */
        .mobile-container {
            width: 100%;
            max-width: 430px; /* 아이폰 프로 화면의 논리적 웹 픽셀 크기에 정확히 맞춤 */
            min-height: 100vh;
            position: relative;
            
            /* 💡 배경 사진과 필터를 body가 아니라 스마트폰 컨테이너 안으로 이동시켰습니다! */
            background-image: 
                linear-gradient(rgba(10, 17, 40, 0.75), rgba(10, 17, 40, 0.95)), 
                url('bg.jpg');
            background-size: cover; 
            background-position: center; 
            background-attachment: scroll;
            
            color: #fff;
            padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); /* PC에서 봤을 때 폰 화면 입체감 그림자 */
            overflow-x: hidden;
        }
        
        /* --- 🎬 인트로 동영상 영역 스타일 --- */
        #intro-video-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px; /* 영상도 아이폰 가로 크기(430px)를 절대 넘지 않도록 제한 */
            height: 100%;
            background-color: #000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }
        #intro-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* 우측 하단 건너뛰기 버튼 */
        #skip-btn {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 30px);
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        #skip-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        
        /* 좌측 하단 소리 제어 버튼 */
        #mute-btn {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 30px);
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            margin-bottom: 20px;
        }
        #mute-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        /* ---------------------------------- */

        .header {
            text-align: center;
            padding: 40px 0 30px;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }
        .content-box {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .content-box h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #fff;
        }
        .content-box ul {
            list-style: none;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
        .content-box li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 22px;
        }
        .content-box li:last-child {
            margin-bottom: 0;
        }
        .content-box li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #fff;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 56px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn-naver {
            background-color: #03c75a;
            color: #ffffff;
        }
        .btn-kakao-main {
            background-color: #FEE500;
            color: #000000;
        }
        .btn-kakao-sub {
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid #FEE500;
            backdrop-filter: blur(5px);
        }
        .btn-insta {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: #ffffff;
            border: none;
        }
        .btn-sub-texts {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            margin-top: -6px;
            margin-bottom: 4px;
            padding-right: 4px;
        }
        .btn-notice {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            word-break: keep-all;
            text-align: right;
        }
        .guide-link {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: underline;
        }
        .guide-link:active {
            color: rgba(255, 255, 255, 0.5);
        }
        .highlight {
            color: #ff4444;
            font-weight: 600;
        }
    </style>
</head>
<body>

<!-- 🎬 인트로 동영상 영역 -->
<div id="intro-video-container" style="display: none;">
    <video id="intro-video" src="1.mp4" muted playsinline></video>
    
    <button id="mute-btn">🔊 소리 켜기</button>
    <button id="skip-btn">건너뛰기 ➔</button>
</div>

<!-- 기존 메인 페이지 영역 -->
<div class="mobile-container">
    <!-- 헤더 영역 -->
    <div class="header">
        <span class="badge">입주예정자 공식 소통 창구</span>
        <h1 class="title">역곡지구 하우스토리</h1>
        <p class="subtitle">
            성공적인 입주를 위해 함께해 주세요.
        </p>
    </div>

    <!-- 안내 본문 -->
    <div class="content-box">
        <h3>📢 입예협 주요 추진 목표</h3>
        <ul>
            <li>성공적인 마감을 위한 시공 품질 모니터링</li>
            <li>55타입 판상형/타워형 등 구조별 하자 사전 점검</li>
            <li>소통 창구 일원화 및 입주민 권익 보호</li>
        </ul>
    </div>

    <!-- 터치 최적화 대형 버튼 영역 -->
    <div class="btn-group">
        <!-- 네이버 카페 -->
        <a href="https://cafe.naver.com/yeokgoka2" class="btn btn-naver">
            네이버 공식 카페 가입하기
        </a>
        
        <!-- 네이버 카페 하단 안내 문구 및 캡쳐 방법 안내 링크 -->
        <div class="btn-sub-texts">
            <div class="btn-notice">※ 외부인 참여를 제한하기 위해 카페 가입시 <span class="highlight">인증</span>이 필요합니다.</div>
            <a href="guide.html" class="guide-link">* 카페가입을위한 인증화면 캡쳐방법 안내</a>
        </div>
        
        <!-- 인스타그램 -->
        <a href="https://www.instagram.com/yk_haustory_official?igsh=aXFva3JwaW5wdjNx" class="btn btn-insta">
            인스타그램 공식 계정 방문하기
        </a>

        <!-- 카카오톡 공식방 -->
        <a href="https://open.kakao.com/o/gg9uYpDi" class="btn btn-kakao-main">
            [공식] 카카오톡 단체방 참여하기
        </a>

        <!-- 카카오톡 단체방 하단 안내 링크 -->
        <div class="btn-sub-texts">
            <a href="guide1-.html" class="guide-link">* 단체방 참여 요청 방법</a>
        </div>

        <!-- 카카오톡 수다방 -->
        <a href="https://open.kakao.com/o/gYtfDYFi" class="btn btn-kakao-sub">
            [수다방] 카카오톡 단체방 참여하기
        </a>
    </div>
</div>

<!-- ⚙️ 자바스크립트: 영상 재생, 소리 제어 및 1회 재생 기억 기능 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const videoContainer = document.getElementById('intro-video-container');
        const video = document.getElementById('intro-video');
        const skipBtn = document.getElementById('skip-btn');
        const muteBtn = document.getElementById('mute-btn');

        if (sessionStorage.getItem('introSeen') === 'true') {
            return; 
        }

        videoContainer.style.display = 'flex';

        function hideVideo() {
            videoContainer.style.opacity = '0';
            setTimeout(() => {
                videoContainer.style.display = 'none';
                video.pause();
                sessionStorage.setItem('introSeen', 'true');
            }, 500);
        }

        video.addEventListener('ended', hideVideo);
        skipBtn.addEventListener('click', hideVideo);

        muteBtn.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                muteBtn.innerHTML = '🔇 소리 끄기';
            } else {
                video.muted = true;
                muteBtn.innerHTML = '🔊 소리 켜기';
            }
        });

        let playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(error => {
                hideVideo();
            });
        }
    });
</script>

</body>
</html>
